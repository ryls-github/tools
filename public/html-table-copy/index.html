<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table Copy</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>

<body>

  <!-- Main Container -->
  <main class="main-container">

    <!-- Control Panel -->
    <section class="control-panel">
      <div class="control-group-wrapper">
        <div class="control-group">
          <label for="input-rows">行数:</label>
          <input type="number" id="input-rows" class="input-number" min="1" max="100" value="3">
        </div>

        <div class="control-group">
          <label for="input-cols">列数:</label>
          <input type="number" id="input-cols" class="input-number" min="1" max="50" value="3">
        </div>

        <div class="control-group"
          style="margin-left: 1rem; padding-left: 1rem; border-left: 1px solid var(--panel-border);">
          <label for="header-rows" title="最初のN行を <thead> / <th> に指定">ヘッダー行数:</label>
          <input type="number" id="header-rows" class="input-number" min="0" max="20" value="1">
        </div>

        <div class="control-group">
          <label for="header-cols" title="最初のN列を <th> に指定">ヘッダー列数:</label>
          <input type="number" id="header-cols" class="input-number" min="0" max="20" value="0">
        </div>
      </div>

      <div class="control-group" style="gap: 0.75rem;">
        <button id="btn-open-preview" class="btn btn-secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
            <polyline points="15 3 21 3 21 9" />
            <line x1="10" y1="14" x2="21" y2="3" />
          </svg>
          確認用画面
        </button>

        <button id="btn-open-import" class="btn btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          インポート
        </button>

        <button id="btn-export" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
          HTML出力
        </button>
      </div>
    </section>

    <!-- Table Canvas -->
    <section class="table-viewport">
      <table id="excel-table" class="excel-table"></table>
    </section>

  </main>

  <!-- Output Modal Dialog -->
  <dialog id="output-dialog" class="output-dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          color="var(--primary-color)">
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
          <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
        </svg>
        生成された HTML コード
      </div>
      <button id="btn-dialog-close-x" class="action-icon-btn" style="font-size: 1.2rem;">✕</button>
    </div>
    <div class="dialog-body">
      <textarea id="html-output" class="code-output-textarea" readonly spellcheck="false"></textarea>
    </div>
    <div class="dialog-footer">
      <div class="format-toggle">
        <label class="format-option">
          <input type="radio" name="format-style" value="pretty" checked>
          インデント整形
        </label>
        <label class="format-option">
          <input type="radio" name="format-style" value="minify">
          最小化 (Minify)
        </label>
      </div>
      <button id="btn-copy" class="btn btn-accent">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </svg>
        HTMLをコピー
      </button>
    </div>
  </dialog>

  <!-- Import Modal Dialog -->
  <dialog id="import-dialog" class="output-dialog">
    <div class="dialog-header">
      <div class="dialog-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          color="var(--primary-color)">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        TSV / CSV インポート
      </div>
      <button id="btn-import-dialog-close-x" class="action-icon-btn" style="font-size: 1.2rem;">✕</button>
    </div>
    <div class="dialog-body">
      <textarea id="import-input" class="code-output-textarea"
        placeholder="TSV または CSV データをここに貼り付けてください...&#10;（タブ文字が含まれる場合はTSV、含まれない場合はCSVとして自動判別します）"
        spellcheck="false"></textarea>
    </div>
    <div class="dialog-footer" style="justify-content: flex-end;">
      <button id="btn-do-import" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        読み込み
      </button>
    </div>
  </dialog>

  <div id="toast-container" class="toast-container" popover="manual"></div>

  <!-- HTML Templates for DOM Cloning -->
  <template id="tpl-col-header">
    <th class="col-header">
      <div class="col-header-content">
        <div class="header-title-container">
          <span class="col-title"></span>
          <span class="header-tag-badge">th</span>
        </div>
        <div class="col-actions">
          <button class="action-icon-btn btn-add-left" title="左に列を挿入">＋</button>
          <button class="action-icon-btn delete-btn btn-del-col" title="この列を削除">✕</button>
          <button class="action-icon-btn btn-add-right" title="右に列を挿入">＋</button>
        </div>
      </div>
    </th>
  </template>

  <template id="tpl-row-header">
    <td class="row-header">
      <div class="row-header-content">
        <div class="header-title-container">
          <span class="row-title"></span>
          <span class="header-tag-badge">thead</span>
        </div>
        <div class="row-actions">
          <button class="action-icon-btn btn-add-above" title="上に行を挿入">＋</button>
          <button class="action-icon-btn delete-btn btn-del-row" title="この行を削除">✕</button>
          <button class="action-icon-btn btn-add-below" title="下に行を挿入">＋</button>
        </div>
      </div>
    </td>
  </template>

  <template id="tpl-data-cell">
    <td class="data-cell">
      <textarea class="cell-textarea"></textarea>
    </td>
  </template>

  <template id="tpl-toast">
    <div class="toast">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="20 6 9 17 4 12" />
      </svg>
      <span class="toast-msg"></span>
    </div>
  </template>
</body>

</html>
